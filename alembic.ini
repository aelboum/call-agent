# Alembic configuration for the PRODUCT's own migration history.
#
# SaaS-OS ADR-0016: the product owns its own migration history, independent of
# the platform's. Both run against the one physical database this product
# owns, in a fixed order: the platform's first (through the installed package,
# via `saas-os-migrate upgrade` or `infra.db.migration_runner`), this one
# second. The two never share a version table -- the platform tracks
# `alembic_version_saas_os`, this history tracks the default
# `alembic_version`.
#
# The database URL is deliberately absent here: `migrations/env.py` reads it
# through `infra.db.config.get_migrations_database_config()`, so a credential
# never lands in a committed file and there is one source of truth for it.

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
