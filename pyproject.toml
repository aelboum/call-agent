[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceagent"
version = "0.1.0"
description = "Multi-tenant AI call-agent platform (Phase 1 foundation). Consumes SaaS-OS as an external pinned dependency."
requires-python = ">=3.13"
readme = "README.md"
license = { text = "UNLICENSED" }

# ADR-0001: SaaS-OS is consumed as an external, pinned Git/VCS dependency at
# an exact commit SHA -- never a branch, never a tag, never an editable local
# path, never vendored, never a submodule. Re-pinning is a deliberate,
# human-reviewed act; automated upgrades are prohibited.
#
# The SHA below was verified against the remote on 2026-09-21
# (`git ls-remote https://github.com/aelboum/saas-os HEAD`).
#
# This is the product's ONLY runtime dependency. Everything the foundation
# needs -- FastAPI, SQLAlchemy (via infra.db only), Alembic, psycopg, Redis,
# ARQ, OpenTelemetry, cryptography -- arrives transitively through saas-os,
# which is the point of ADR-0001: the product does not re-declare, and
# therefore cannot independently drift from, the platform's stack.
dependencies = [
    "saas-os @ git+https://github.com/aelboum/saas-os@ff550010e5eafecace7311038aadc99fcecfbe3d",
    # Phase 2.3: the real STT adapters (Deepgram, AssemblyAI) need a
    # WebSocket client for streaming transcription -- no vendor SDK is
    # installed for either, so this is the only new dependency the
    # multi-provider vertical slice requires. LLM (Gemini/Mistral/Groq) and
    # TTS (ElevenLabs/Deepgram Aura) adapters use `httpx` (already present,
    # transitively, via the platform's own stack) over SSE/HTTP-streaming,
    # needing nothing new. Pinned exactly, not `>=`/`*` (repo dependency
    # policy) -- the version installed and verified during this phase.
    "websockets==17.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "import-linter>=2.0",
]
security = [
    "detect-secrets>=1.5",
]
# ADR-0006: Pipecat is an OPTIONAL extra, never a base dependency, and is
# importable only from `voiceagent.providers.engines.pipecat`. It is
# deliberately NOT installed in Phase 1 -- the foundation does not need it,
# and the exact version pin is a Phase 2 decision made alongside the first
# real engine implementation. The extra is declared here (empty) so the
# consumption shape is fixed by the foundation rather than improvised later.
pipecat = []

[tool.setuptools]
# Explicit, fully-enumerated package list rather than automatic discovery:
# auditable, and it cannot silently pick up `tests/`, `migrations/` or
# `frontend/` the way a repo-root scan could. Same rationale as saas-os's own
# packaging (its ADR-0015 implementation note).
packages = [
    "voiceagent",
    "voiceagent.agents",
    "voiceagent.api",
    "voiceagent.api.v1",
    "voiceagent.calls",
    "voiceagent.config",
    "voiceagent.conversations",
    "voiceagent.db",
    "voiceagent.phone_numbers",
    "voiceagent.providers",
    "voiceagent.providers.engines",
    "voiceagent.providers.stt",
    "voiceagent.providers.llm",
    "voiceagent.providers.tts",
    "voiceagent.runtime",
    "voiceagent.telephony",
    "voiceagent.telephony.freeswitch",
    "voiceagent.tenancy",
    "voiceagent.tools",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is the idiom pytest is built on.
per-file-ignores = { "tests/**" = ["S101"] }

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["voiceagent", "tests"]
# Resolve the pinned `saas-os` (and its dependencies) from the project venv.
# Without this, pyright type-checks against the interpreter it happens to find
# and reports every platform import as unresolved -- a failure mode that looks
# like a boundary violation but is only a configuration gap.
venvPath = "."
venv = ".venv"
# Migrations are Alembic-generated scaffolding with its own conventions and
# are type-checked by neither this project nor saas-os's own.
exclude = ["migrations", "frontend", ".venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `integration` tests require a real PostgreSQL instance -- excluded by
# default so the normal suite stays hermetic (no PostgreSQL, Redis, network,
# provider or FreeSWITCH), exactly mirroring the pinned SaaS-OS's own
# convention (its pyproject.toml: `addopts = "-ra -m \"not integration and
# not packaging\""`, `tests/infra/test_db_integration.py`). Run explicitly
# with `pytest -m integration` against a real database; see
# tests/integration/README.md.
addopts = "-q -m \"not integration\""
markers = [
    "integration: requires a real PostgreSQL instance with this product's migrations applied; excluded by default, see tests/integration/README.md",
]

# ---------------------------------------------------------------------------
# Architecture boundaries (Phase 0.1: ADR-0006, ADR-0007, ADR-0002 amendment).
#
# These import-linter contracts are one of two enforcement layers. The other
# is `tests/architecture/test_import_boundaries.py`, an AST scan that runs
# with no dependencies installed and therefore also covers the case where a
# forbidden package (pipecat) is not installed at all. Both run in CI.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["voiceagent"]
include_external_packages = true

# ADR-0007: application code may never import SQLAlchemy/psycopg. The
# omissions in `infra.db`'s re-export surface (`sqlalchemy.text`,
# `sqlalchemy.func`) are documented RLS-bypass defenses, not oversights --
# reaching around `voiceagent.db` would restore that capability class inside
# this product. `migrations/` is not part of the `voiceagent` package and so
# is outside this contract by construction: migration code owns physical
# PostgreSQL types and imports SQLAlchemy directly, exactly as saas-os's own
# reference consumer does.
#
# No `ignore_imports` is needed: `root_packages` is this product alone, so
# grimp builds the graph from `voiceagent`'s own modules and records an
# external dependency only as the top-level edge `voiceagent.db -> infra`. It
# never traces *inside* `infra`, so the sanctioned `infra.db -> sqlalchemy`
# edge is not in the graph and cannot trip this contract -- while a direct
# `voiceagent.<anything> -> sqlalchemy` edge is in the graph and does.
[[tool.importlinter.contracts]]
name = "Application code never imports SQLAlchemy or psycopg directly"
type = "forbidden"
source_modules = ["voiceagent"]
forbidden_modules = ["sqlalchemy", "psycopg", "psycopg2"]

# ADR-0002 (2026-09-21 amendment): FreeSWITCH/ESL/mod_audio_stream internals
# live behind `voiceagent.telephony.freeswitch` and nothing else may depend on
# them. Domain code sees `TelephonyProvider`/`MediaProvider`, never an ESL
# command, a channel-UUID semantic, or a FreeSWITCH hangup cause.
#
# The source list is enumerated rather than expressed as "voiceagent except
# that subpackage" (import-linter has no such exclusion), which also keeps the
# rule from being overly broad: a future legitimate adapter added *inside*
# `voiceagent.telephony.freeswitch` needs no contract change.
[[tool.importlinter.contracts]]
name = "FreeSWITCH internals stay behind voiceagent.telephony.freeswitch"
type = "forbidden"
source_modules = [
    "voiceagent.api",
    "voiceagent.config",
    "voiceagent.conversations",
    "voiceagent.db",
    "voiceagent.providers",
    "voiceagent.runtime",
    "voiceagent.tenancy",
    "voiceagent.telephony.contracts",
    "voiceagent.telephony.fakes",
    "voiceagent.tools",
]
forbidden_modules = ["voiceagent.telephony.freeswitch"]

# ADR-0006: the ConversationEngine contract is product-owned and Pipecat-free.
# Pipecat is importable only from `voiceagent.providers.engines.pipecat`.
#
# Enforced now, while Pipecat is deliberately NOT installed: import-linter was
# verified to accept a forbidden module it cannot resolve (an uninstalled
# package simply never appears as an edge), so the fence exists before the
# first import does -- which is the whole point of it.
[[tool.importlinter.contracts]]
name = "Pipecat stays behind voiceagent.providers.engines.pipecat"
type = "forbidden"
source_modules = [
    "voiceagent.api",
    "voiceagent.config",
    "voiceagent.conversations",
    "voiceagent.db",
    "voiceagent.runtime",
    "voiceagent.telephony",
    "voiceagent.tenancy",
    "voiceagent.tools",
    "voiceagent.providers.engines.contracts",
    "voiceagent.providers.engines.fakes",
]
forbidden_modules = ["pipecat"]

# Phase 2.3: each vendor's request/response shape stays inside its own
# adapter module. Everything above a component registry depends on
# `voiceagent.providers.stt.registry.create_stt_provider()` (and the llm/tts
# equivalents) -- never a vendor module directly.
#
# `voiceagent.providers.engines.factory` is deliberately NOT a source module
# here: it legitimately *transitively* reaches every vendor module through
# the registries it calls (`import-linter`'s "forbidden" contract treats
# transitive reachability as a violation, which would make this contract
# reject factory.py's own, correct, registry-mediated import). Factory.py's
# own "no vendor module imported directly" property is instead enforced by
# `tests/architecture/test_import_boundaries.py
# ::test_vendor_adapter_modules_are_confined_to_their_own_registry`, an
# AST scan that checks direct imports only -- the two enforcement layers
# are complementary, not redundant, exactly as this repository's existing
# Pipecat/FreeSWITCH fences already are (both an import-linter contract and
# an AST test).
[[tool.importlinter.contracts]]
name = "STT vendor adapters stay behind voiceagent.providers.stt.registry"
type = "forbidden"
source_modules = [
    "voiceagent.api",
    "voiceagent.config",
    "voiceagent.conversations",
    "voiceagent.db",
    "voiceagent.runtime",
    "voiceagent.telephony",
    "voiceagent.tenancy",
    "voiceagent.tools",
    "voiceagent.providers.engines.contracts",
    "voiceagent.providers.engines.pipelined",
    "voiceagent.providers.engines.realtime",
]
forbidden_modules = [
    "voiceagent.providers.stt.deepgram",
    "voiceagent.providers.stt.assemblyai",
]

[[tool.importlinter.contracts]]
name = "LLM vendor adapters stay behind voiceagent.providers.llm.registry"
type = "forbidden"
source_modules = [
    "voiceagent.api",
    "voiceagent.config",
    "voiceagent.conversations",
    "voiceagent.db",
    "voiceagent.runtime",
    "voiceagent.telephony",
    "voiceagent.tenancy",
    "voiceagent.tools",
    "voiceagent.providers.engines.contracts",
    "voiceagent.providers.engines.pipelined",
    "voiceagent.providers.engines.realtime",
]
forbidden_modules = [
    "voiceagent.providers.llm.gemini",
    "voiceagent.providers.llm.mistral",
    "voiceagent.providers.llm.groq",
]

[[tool.importlinter.contracts]]
name = "TTS vendor adapters stay behind voiceagent.providers.tts.registry"
type = "forbidden"
source_modules = [
    "voiceagent.api",
    "voiceagent.config",
    "voiceagent.conversations",
    "voiceagent.db",
    "voiceagent.runtime",
    "voiceagent.telephony",
    "voiceagent.tenancy",
    "voiceagent.tools",
    "voiceagent.providers.engines.contracts",
    "voiceagent.providers.engines.pipelined",
    "voiceagent.providers.engines.realtime",
]
forbidden_modules = [
    "voiceagent.providers.tts.elevenlabs",
    "voiceagent.providers.tts.deepgram_aura",
]

# Phase 2.4: the ConversationEngine contract and its two implementations
# never execute a tool themselves and never know which application service
# implements one (ADR-0003 point 1; brief section 12: "the engine must not
# execute the handler itself"). `voiceagent.runtime.call_task` is the only
# module that imports `voiceagent.tools` -- it dispatches a
# `ToolCallRequested` to the gateway and hands the `ToolResult` back to the
# engine through the existing `EngineSession.submit_tool_result()` contract,
# never the other way around.
[[tool.importlinter.contracts]]
name = "The ConversationEngine never imports the Tool Gateway"
type = "forbidden"
source_modules = [
    "voiceagent.providers.engines.contracts",
    "voiceagent.providers.engines.pipelined",
    "voiceagent.providers.engines.realtime",
    "voiceagent.providers.engines.fakes",
    "voiceagent.providers.engines.factory",
]
forbidden_modules = ["voiceagent.tools"]

# Phase 2.5: the ConversationEngine emits product-owned events
# (SystemPromptSet/FinalTranscript/AssistantResponse/ToolCallRequested); it
# never persists one itself. Persistence belongs to
# `voiceagent.runtime.conversation_persistence`, which
# `voiceagent.runtime.call_task` alone wires into the pump as a plain,
# synchronous callback -- mirroring the identical Tool Gateway fence above.
[[tool.importlinter.contracts]]
name = "The ConversationEngine never imports conversation persistence"
type = "forbidden"
source_modules = [
    "voiceagent.providers.engines.contracts",
    "voiceagent.providers.engines.pipelined",
    "voiceagent.providers.engines.realtime",
    "voiceagent.providers.engines.fakes",
    "voiceagent.providers.engines.factory",
]
forbidden_modules = ["voiceagent.conversations", "voiceagent.db"]
